name: kyq_radio
description: Radio Kyq (011) compartida por Kyq Conductor y Kyq Pasajero; lista, conversación, historial, estados y modo auto.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  go_router: ^18.1.1
  image_picker: ^1.2.4
  just_audio: ^0.10.5
  kyq_api:
    path: ../kyq_api
  kyq_ptt:
    path: ../kyq_ptt
  kyq_realtime:
    path: ../kyq_realtime
  kyq_ui:
    path: ../kyq_ui
  mobile_scanner: ^7.4.2
  play_install_referrer: ^0.6.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
