name: kyq_ui
description: Tema, componentes y flujo de login comunes de las apps Kyq.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  kyq_api:
    path: ../kyq_api
  package_info_plus: ^10.2.2
  # 9.30.x: compileSdk 36 y minSdk 21; la 10.x exige minSdk 26 en las apps.
  sentry_flutter: 9.30.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
