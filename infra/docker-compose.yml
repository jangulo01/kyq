# Entorno local de desarrollo. Credenciales solo para desarrollo: no usar en producción.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: kyq
      POSTGRES_USER: kyq
      POSTGRES_PASSWORD: kyq_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"

  livekit:
    image: livekit/livekit-server:v1.9.0
    # --dev usa las claves devkey / secret
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  osrm:
    image: osrm/osrm-backend:v5.27.1
    # Requiere los datos preprocesados en infra/data/osrm (ver infra/README.md)
    command: osrm-routed --algorithm mld /data/city.osrm
    volumes:
      - ./data/osrm:/data
    ports:
      - "5000:5000"

  tiles:
    image: caddy:2-alpine
    # Sirve las teselas PMTiles de infra/data/tiles en desarrollo (en producción: R2)
    command: caddy file-server --root /srv --listen :8081 --access-log
    volumes:
      - ./data/tiles:/srv:ro
    ports:
      - "8081:8081"

volumes:
  pgdata:
