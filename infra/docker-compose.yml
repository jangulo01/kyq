# Entorno de desarrollo completo. Secretos en infra/.env (copiar de .env.example; no se versiona).
#   docker compose up -d --build            # backend + servicios
#   docker compose --profile routing up -d  # además OSRM (requiere infra/data/osrm, ver README)
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: kyq
      POSTGRES_USER: kyq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h fuerza TCP: en el primer arranque Postgres solo escucha el socket mientras inicializa.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kyq -d kyq"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ../backend
    entrypoint: ["/app/migrate", "up"]
    environment:
      KYQ_DATABASE_URL: postgres://kyq:${POSTGRES_PASSWORD}@postgres:5432/kyq?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ../backend
    entrypoint: ["/app/seed"]
    environment:
      KYQ_DATABASE_URL: postgres://kyq:${POSTGRES_PASSWORD}@postgres:5432/kyq?sslmode=disable
      KYQ_SEED_ADMIN_PHONE: ${KYQ_SEED_ADMIN_PHONE}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ../backend
    environment:
      KYQ_HTTP_ADDR: ":8080"
      KYQ_DATABASE_URL: postgres://kyq:${POSTGRES_PASSWORD}@postgres:5432/kyq?sslmode=disable
      KYQ_JWT_SECRET: ${KYQ_JWT_SECRET}
      KYQ_CENTRIFUGO_API_URL: http://centrifugo:8000/api
      KYQ_CENTRIFUGO_API_KEY: ${KYQ_CENTRIFUGO_API_KEY}
      KYQ_CENTRIFUGO_TOKEN_SECRET: ${KYQ_CENTRIFUGO_TOKEN_SECRET}
      KYQ_LIVEKIT_URL: ws://${KYQ_PUBLIC_HOST}:7880
      KYQ_LIVEKIT_API_KEY: devkey
      KYQ_LIVEKIT_API_SECRET: secret
      KYQ_OSRM_URL: http://osrm:5000
      KYQ_DEV_OTP_CODE: ${KYQ_DEV_OTP_CODE}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo --config=/centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${KYQ_CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${KYQ_CENTRIFUGO_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${KYQ_CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${KYQ_CENTRIFUGO_ADMIN_SECRET}
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9.0
    # --dev usa las claves devkey / secret; --node-ip para que el móvil llegue por la LAN.
    command: --dev --bind 0.0.0.0 --node-ip ${KYQ_PUBLIC_HOST}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  osrm:
    profiles: ["routing"]
    image: osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/city.osrm
    volumes:
      - ./data/osrm:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  tiles:
    profiles: ["routing"]
    image: caddy:2-alpine
    command: caddy file-server --root /srv --listen :8081
    volumes:
      - ./data/tiles:/srv:ro
    ports:
      - "8081:8081"

volumes:
  pgdata:
