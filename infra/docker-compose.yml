# Entorno local de desarrollo. Credenciales solo para desarrollo: no usar en producción.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: kyq
      POSTGRES_USER: kyq
      POSTGRES_PASSWORD: kyq_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"

  livekit:
    image: livekit/livekit-server:v1.9.0
    # --dev usa las claves devkey / secret
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
