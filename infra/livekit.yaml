# Solo el backend crea salas (POST /ptt/token). Sin creación automática, un token emitido antes
# de cerrar el canal no puede volver a abrir la sala (RN-KYQ-014).
room:
  auto_create: false
# Redis (003): LiveKit Egress recibe las peticiones de grabación SOS a través de Redis.
redis:
  address: redis:6379
# Minutos de voz por conductor (T077): la API valida la firma con la misma clave.
webhook:
  api_key: devkey
  urls:
    - http://api:8080/v1/livekit/webhook
