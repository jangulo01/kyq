# LiveKit Egress (003, research R4): graba el audio de las salas sos-{alertId} en OGG/Opus en el
# bucket privado kyq-sos. La API inicia y detiene cada grabación (StartRoomCompositeEgress con
# audio_only y filepath sos/{alertId}.ogg). Claves de desarrollo de LiveKit (--dev).
# Las credenciales S3 no se versionan: llegan por AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
log_level: info
api_key: devkey
api_secret: secret
ws_url: ws://livekit:7880
redis:
  address: redis:6379
storage:
  s3:
    region: us-east-1
    endpoint: http://minio:9000
    bucket: kyq-sos
    force_path_style: true
