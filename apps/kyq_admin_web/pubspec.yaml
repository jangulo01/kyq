name: kyq_admin_web
description: "Kyq Admin: panel administrativo y torre de control web."
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # Consola de emergencias (003): aviso sonoro, mapa en vivo, voz y tiempo real.
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.1.1
  maplibre_gl: ^0.27.1
  kyq_api:
    path: ../../packages/kyq_api
  kyq_ptt:
    path: ../../packages/kyq_ptt
  kyq_realtime:
    path: ../../packages/kyq_realtime
  kyq_ui:
    path: ../../packages/kyq_ui
  url_launcher: ^6.3.3
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
