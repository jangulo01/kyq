<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kyq Admin: panel de administración y torre de control.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kyq Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kyq Admin</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Mapa de la torre de control (007, research R4). El estilo propio apunta a pmtiles://, que
    MapLibre GL JS no lee sin el protocolo de pmtiles; por eso la página carga MapLibre (la versión
    contra la que está escrito maplibre_gl 0.27.1), registra el protocolo y publica el global
    `maplibregl`. La app usa MapLibreJsSource.preloaded(). Versiones exactas, no rangos.
  -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.4.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
  <script type="module">
    const maplibregl = await import('https://unpkg.com/maplibre-gl@6.4.1/dist/maplibre-gl.mjs');
    if (globalThis.pmtiles) {
      maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
    }
    globalThis.maplibregl = maplibregl;
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
