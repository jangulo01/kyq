name: kyq_rider_app
description: "Kyq Pasajero: app del pasajero (Android, iOS y web)."
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.1
  kyq_api:
    path: ../../packages/kyq_api
  kyq_domain:
    path: ../../packages/kyq_domain
  kyq_ptt:
    path: ../../packages/kyq_ptt
  kyq_realtime:
    path: ../../packages/kyq_realtime
  kyq_ui:
    path: ../../packages/kyq_ui
  maplibre_gl: ^0.27.1
  mobile_scanner: ^7.4.2
  # Compartir el viaje en vivo y llamar al 123 desde el SOS (003). share_plus 13.3.1: compileSdk 36.
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
