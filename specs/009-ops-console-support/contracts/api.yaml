openapi: 3.1.0
info:
  title: Kyq API — 009 operación del panel (rutas nuevas y cambiadas)
  version: 0.5.0
  description: |
    Vista de las rutas nuevas y cambiadas de 009. Las definiciones viven en el contrato principal
    `specs/001-chosen-driver-trip-ptt/contracts/api.yaml`, contra el que corren las pruebas de
    contrato (`backend/internal/contracttest/ops_support_test.go`); aquí solo se referencian.

    Cambios en rutas existentes:
    - `POST /v1/auth/otp/verify` y `POST /v1/auth/refresh`: el `403 account_suspended` de 007
      trae `support_session` (alcance `support`): solo abre `/v1/support/*`, `/v1/realtime/*` y
      `/v1/auth/*`.
    - `GET /v1/admin/tower`: `TowerDriver.active_trip_id` y `TowerCell.trip_ids`.

    Tiempo real (contracts/realtime.md de 001): `support.case` en `user:{id}` y `admin:support`;
    `megaphone.started` y `megaphone.ended` en `user:{driverId}`.
