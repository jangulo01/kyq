          description: Null si LiveKit no respondió; la app pide GET /v1/sos/{alertId}/token
          oneOf:
            - { $ref: '#/components/schemas/SosVoice' }
            - { type: 'null' }
        needs_pin: { type: boolean, description: 'Sin PIN: pedir configurarlo al terminar (US4-3)' }
    SosAlertSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: [string, 'null'], format: uuid, description: 'Nulo: "Sin viaje · desde Radio" (011)' }
        raised_from: { type: string, enum: [trip, radio] }
        raised_role: { type: string, enum: [passenger, driver] }
        raised_by_name: { type: string }
        status: { $ref: '#/components/schemas/SosStatus' }
        cancel_without_pin: { type: boolean, description: 'Intento de cancelar sin PIN válido (posible coacción)' }
        claimed_by: { type: [string, 'null'], format: uuid }
        claimed_by_name: { type: [string, 'null'] }
        outcome:
          oneOf:
            - { $ref: '#/components/schemas/SosOutcome' }
            - { type: 'null' }
        escalated: { type: boolean }
        has_recording: { type: boolean }
        created_at: { type: string, format: date-time }
        claimed_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        last_location:
          oneOf:
            - { $ref: '#/components/schemas/SosLocation' }
            - { type: 'null' }
    SosNote:
      type: object
      properties:
        id: { type: string, format: uuid }
