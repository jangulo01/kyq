            emergency_contacts: { type: array, items: { $ref: '#/components/schemas/EmergencyContact' } }
            trip:
              type: object
              properties:
                status: { type: string }
                pickup: { $ref: '#/components/schemas/Point' }
                dropoff: { $ref: '#/components/schemas/Point' }
            passenger:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                name: { type: string }
            driver:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                name: { type: string }
                vehicle_plate: { type: string }
                vehicle_description: { type: string }
                vehicle_brand: { type: [string, 'null'] }
                vehicle_model: { type: [string, 'null'] }
                vehicle_color: { type: [string, 'null'] }
            track: { type: array, items: { $ref: '#/components/schemas/SosLocation' }, description: Recorrido desde el SOS }
            notes: { type: array, items: { $ref: '#/components/schemas/SosNote' } }
            related_alert_ids: { type: array, items: { type: string, format: uuid }, description: 'Otras alertas del mismo viaje' }
            recording_url: { type: [string, 'null'], description: 'URL firmada de 5 min cuando la grabación existe (FR-018)' }
            raised_by_alerts: { type: integer, description: 'Alertas de la persona (historial de abusos)' }
            raised_by_false_alarms: { type: integer }
