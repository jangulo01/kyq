              properties:
                enabled:
                  type: boolean
      responses:
        '204':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/radio/clients/{passengerId}:
    put:
      summary: Silencia o bloquea a un cliente (FR-003)
