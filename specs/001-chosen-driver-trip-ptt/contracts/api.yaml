        cooperative_status: { $ref: '#/components/schemas/CooperativeStatus' }
        role: { $ref: '#/components/schemas/CooperativeRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        reject_reason: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
    CooperativeDetail:
      type: object
      properties:
        cooperative: { $ref: '#/components/schemas/Cooperative' }
        members:
          type: array
          items: { $ref: '#/components/schemas/CooperativeMember' }
        requests:
          type: array
          items: { $ref: '#/components/schemas/MembershipRequest' }
    DriverCooperative:
      type: object
      properties:
        membership:
          description: Membresía activa o pendiente; si no hay, la última rechazada (para ver el motivo) o null
          oneOf: [ { $ref: '#/components/schemas/Membership' }, { type: 'null' } ]
        members:
          type: array
          description: Compañeros (solo con membresía activa)
          items: { $ref: '#/components/schemas/CooperativeMember' }
        requests:
          type: array
          description: Solicitudes pendientes (solo coordinadores)
