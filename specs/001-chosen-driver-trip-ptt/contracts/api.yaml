    SosLocation:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        accuracy_m: { type: [number, 'null'] }
        at: { type: string, format: date-time }
    SosStatus: { type: string, enum: [open, claimed, closed, cancelled_by_user] }
    SosOutcome: { type: string, enum: [false_alarm, resolved, escalated_authorities, no_response] }
    SosAlertSelf:
      type: object
      description: Lo que ve quien activó la alerta
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: [string, 'null'], format: uuid, description: 'Nulo en una alerta desde Radio sin viaje (011)' }
        status: { $ref: '#/components/schemas/SosStatus' }
