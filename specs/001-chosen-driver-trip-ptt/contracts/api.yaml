          type: string
          format: uuid
        message_kind:
          type: string
        conversation_title:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    ReportDetail:
      allOf:
      - $ref: '#/components/schemas/Report'
      - type: object
        properties:
          message:
            $ref: '#/components/schemas/Message'
          media_url:
            type:
            - string
            - 'null'
            format: uri
          author_name:
            type: string
