    TripInspection:
      type: object
      required: [trip_id, status, active, dispatch, passenger, driver, vehicle_plate, pickup, dropoff, distance_m, duration_s, currency, list_fare_minor, suggested_fare_minor, steps, generated_at]
      properties:
        trip_id: { type: string, format: uuid }
        status: { type: string }
        active: { type: boolean }
        cancel_reason: { type: [string, 'null'] }
        dispatch: { type: string, enum: [chosen_driver, cooperative, zone_pool] }
        handover_count: { type: integer }
        cooperative_name: { type: [string, 'null'] }
        passenger: { $ref: '#/components/schemas/PersonRef' }
        driver: { $ref: '#/components/schemas/PersonRef' }
        vehicle_plate: { type: string }
        vehicle_description: { type: string }
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
        distance_m: { type: integer }
        duration_s: { type: integer }
        currency: { type: string }
        list_fare_minor: { type: integer }
        suggested_fare_minor: { type: integer }
        agreed_fare_minor: { type: [integer, 'null'] }
        preferential_discount_pct: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [status, at]
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
        driver_position:
          type: [object, 'null']
          properties:
            lat: { type: number }
            lng: { type: number }
            location_at: { type: string, format: date-time }
            stale: { type: boolean }
        payment:
          type: [object, 'null']
          properties:
            status: { type: string }
            method: { type: [string, 'null'] }
        open_sos:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            status: { type: string }
        generated_at: { type: string, format: date-time }
    PersonRef:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    SupportTopic: { type: string, enum: [trip, payment, lost_item, safety, account, other] }
    SupportStatus: { type: string, enum: [open, in_progress, waiting_user, resolved, closed] }
    SupportCase:
      type: object
      required: [id, topic, subject, status, user, user_role, created_at, last_message_at, awaiting_reply]
      properties:
        id: { type: string, format: uuid }
        topic: { $ref: '#/components/schemas/SupportTopic' }
        subject: { type: string }
        status: { $ref: '#/components/schemas/SupportStatus' }
        user: { $ref: '#/components/schemas/PersonRef' }
        user_role: { type: string, enum: [passenger, driver] }
        counterpart: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        trip_id: { type: [string, 'null'], format: uuid }
        trip_payment_id: { type: [string, 'null'], format: uuid }
        assigned_to: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        created_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }
        last_user_message_at: { type: [string, 'null'], format: date-time }
        awaiting_reply: { type: boolean }
        resolved_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
    SupportMessage:
      type: object
      required: [id, author_kind, mine, body, internal, created_at]
      properties:
        id: { type: string, format: uuid }
        author_kind: { type: string, enum: [user, admin, system] }
        author_name: { type: [string, 'null'] }
        mine: { type: boolean }
        body: { type: string }
        internal: { type: boolean }
        created_at: { type: string, format: date-time }
    SupportCaseDetail:
      allOf:
        - $ref: '#/components/schemas/SupportCase'
        - type: object
          required: [messages]
          properties:
            messages: { type: array, items: { $ref: '#/components/schemas/SupportMessage' } }
    MegaphoneStarted:
      type: object
      required: [broadcast_id, url, token, ends_at, recipients]
      properties:
        broadcast_id: { type: string, format: uuid }
        url: { type: string }
        token: { type: string }
        ends_at: { type: string, format: date-time }
        recipients: { type: integer }
    MegaphoneBroadcast:
      type: object
      required: [id, admin_name, cells, resolution, started_at, recipients]
      properties:
        id: { type: string, format: uuid }
        admin_name: { type: string }
        cells: { type: array, items: { type: string } }
        resolution: { type: integer }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        duration_s: { type: [integer, 'null'] }
        recipients: { type: integer }
    SessionsReport:
      type: object
      required: [status, checked_at, target, apps]
      properties:
        status: { type: string, enum: [ok, not_configured, unavailable] }
        checked_at: { type: string, format: date-time }
        target: { type: number }
        apps:
          type: array
          items:
            type: object
            required: [app, below_target, link]
            properties:
              app: { type: string, enum: [driver, rider, admin] }
              crash_free_24h: { type: [number, 'null'] }
              crash_free_7d: { type: [number, 'null'] }
              top_release: { type: [string, 'null'] }
              below_target: { type: boolean }
              link: { type: string }
    SignedDomainList:
      type: object
      required: [payload, signature]
      properties:
        payload:
          type: string
          description: 'JSON {"version","issued_at","domains":[{"api_url","realtime_url"}]} tal como se firmó'
        signature: { type: string, description: 'Ed25519 en base64 de los bytes de payload' }
    MirrorDomain:
      type: object
      required: [id, api_url, realtime_url, position, active, status]
      properties:
        id: { type: string, format: uuid }
        api_url: { type: string }
        realtime_url: { type: string }
        position: { type: integer }
        active: { type: boolean }
        status: { type: string, enum: [ok, down, unchecked] }
        latency_ms: { type: [integer, 'null'] }
    MirrorDomainListing:
      type: object
      required: [version, signing_configured, domains]
      properties:
        version: { type: integer }
        signing_configured: { type: boolean }
        public_key: { type: [string, 'null'] }
        domains: { type: array, items: { $ref: '#/components/schemas/MirrorDomain' } }

    # ---------- 010 ----------
    DriverZone:
      type: object
      required: [cell, lat, lng]
      properties:
        cell: { type: string }
        lat: { type: number }
        lng: { type: number }
    Reservation:
      type: object
      required: [id, passenger, driver, pickup, dropoff, scheduled_at, distance_m, duration_s, currency, fare_minor, list_fare_minor, status]
      properties:
        id: { type: string, format: uuid }
        passenger: { $ref: '#/components/schemas/PersonRef' }
        driver: { $ref: '#/components/schemas/PersonRef' }
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
        pickup_label: { type: [string, 'null'] }
        dropoff_label: { type: [string, 'null'] }
        scheduled_at: { type: string, format: date-time }
        distance_m: { type: integer }
        duration_s: { type: integer }
        currency: { type: string }
        fare_minor: { type: integer, description: 'Tarifa reservada' }
        list_fare_minor: { type: integer }
        preferential_discount_pct: { type: integer }
        status: { type: string, enum: [pending, confirmed, rejected, cancelled, expired, fulfilled, missed] }
        cancelled_by_me: { type: boolean }
        trip_id: { type: [string, 'null'], format: uuid }
        overlaps: { type: boolean, description: 'Agenda: otra reserva del conductor a menos de 30 minutos' }
    ClientCard:
      type: object
      required: [passenger_id, display_name, affiliated_at, source, trips_together, upcoming_reservations]
      properties:
        passenger_id: { type: string, format: uuid }
        display_name: { type: string }
        affiliated_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/AffiliationSource' }
        trips_together: { type: integer }
        last_trip_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], description: 'Privada del conductor; nunca llega al pasajero' }
        upcoming_reservations:
          type: array
          items:
            type: object
            required: [id, scheduled_at, status]
            properties:
              id: { type: string, format: uuid }
              scheduled_at: { type: string, format: date-time }
              status: { type: string }
    Place:
      type: object
      required: [label, detail, lat, lng]
      properties:
        label: { type: string }
        detail: { type: string }
        lat: { type: number }
        lng: { type: number }

    # 011 Radio Kyq
    PresenceStatus:
      type: string
      enum:
      - available
      - busy
      - listen_only
      - offline
    Role:
      type: string
      enum:
      - owner
      - moderator
      - member
      - listener
    RadioMe:
      type: object
      required:
      - access
      - status
      - radio_on
      - push_mode
      - consent_required
      properties:
        access:
          type: string
          enum:
          - full
          - listen
          - none
        access_reason:
          type:
          - string
          - 'null'
          enum:
          - suspended
          - no_subscription
          - trial_ended
          - not_allowed
          - null
        trial_days_left:
          type:
          - integer
          - 'null'
        status:
          $ref: '#/components/schemas/PresenceStatus'
        radio_on:
          type: boolean
        push_mode:
          type: string
          enum:
          - hold
          - toggle
        timezone:
          type: string
        consent_required:
          type: boolean
        retention_days:
          type: integer
        clients_enabled:
          type:
          - boolean
          - 'null'
          description: Solo conductores
    QuietHours:
      type: object
      required:
      - weekdays
      - starts
      - ends
      - enabled
      properties:
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        starts:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        ends:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        enabled:
          type: boolean
    Conversation:
      type: object
      required:
      - id
      - kind
      - title
      - listening
      - unread_count
      - status
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - direct
          - client
          - channel
          - cooperative
        title:
          type: string
        photo_url:
          type:
          - string
          - 'null'
        peer_status:
          oneOf:
          - $ref: '#/components/schemas/PresenceStatus'
          - type: 'null'
        online_count:
          type:
          - integer
          - 'null'
        my_role:
          oneOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          description: Solo canales y cooperativa
        my_member_status:
          type: string
          enum:
          - pending
          - active
          - muted
        listening:
          type: boolean
        unread_count:
          type: integer
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - active
          - suspended
        peer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: El otro en un contacto o conversación de cliente
        peer_muted:
          type: boolean
          description: El conductor silenció a este cliente (FR-003)
        peer_blocked:
          type: boolean
          description: El conductor bloqueó a este cliente (FR-003)
        can_talk:
          type: boolean
          description: El botón grande transmite aquí (rol, silenciado, bloqueo, acceso)
    ConversationDetail:
      allOf:
      - $ref: '#/components/schemas/Conversation'
      - type: object
        properties:
          description:
            type:
            - string
            - 'null'
          join_mode:
            type:
            - string
            - 'null'
            enum:
            - open_link
            - approval
            - null
          passenger_role_max:
            oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
          members:
            type: array
            items:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                display_name:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
                status:
                  type: string
                  enum:
                  - pending
                  - active
                  - muted
                  - blocked
                presence:
                  $ref: '#/components/schemas/PresenceStatus'
                is_passenger:
                  type: boolean
    ChannelInput:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 40
        description:
          type: string
          maxLength: 200
        join_mode:
          type: string
          enum:
          - open_link
          - approval
        passenger_role_max:
          oneOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
    Credentials:
      type: object
      required:
      - url
      - token
      - room
      - expires_at
      properties:
        url:
          type: string
        token:
          type: string
        room:
          type: string
        expires_at:
          type: string
          format: date-time
    Message:
      type: object
      required:
      - id
      - conversation_id
      - kind
      - status
      - created_at
      - heard
      - saved
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        author_id:
          type:
          - string
          - 'null'
          format: uuid
        author_name:
          type: string
        kind:
          type: string
          enum:
          - voice
          - text
          - photo
          - location
          - alert
          - emergency
        status:
          type: string
          enum:
          - recording
          - ready
        body:
          type:
          - string
          - 'null'
        lat:
          type:
          - number
          - 'null'
        lng:
          type:
          - number
          - 'null'
        duration_ms:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        heard:
          type: boolean
        saved:
          type: boolean
        has_media:
          type: boolean
          description: Tiene audio o foto que pedir a …/media
    Invite:
      type: object
      required:
      - code
      - url
      - expires_at
      properties:
        code:
          type: string
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    InvitePreview:
      type: object
      required:
