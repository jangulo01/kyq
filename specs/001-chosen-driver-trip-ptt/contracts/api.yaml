      parameters:
      - name: file_name
        in: query
        schema:
          type: string
      requestBody:
        content:
          text/csv:
            schema:
              type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadDetail'
          description: Creado
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/admin/radio/bulk-uploads/{bulkId}:
    get:
      summary: Estado por fila
      parameters:
      - name: bulkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadDetail'
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/admin/radio/bulk-uploads/{bulkId}/send:
    post:
      summary: Confirma y envía los SMS; con `only_failed` reenvía las fallidas; `409 bulk_state` si ya se envía
      parameters:
      - name: bulkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                only_failed:
                  type: boolean
      responses:
        '202':
          description: Envío en curso
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/admin/radio/reports:
    get:
      summary: Cola de reportes abiertos (FR-036)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/admin/radio/reports/{reportId}:
    get:
      summary: Abre un reporte con el mensaje y su URL; registra el acceso (FR-037)
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/admin/radio/reports/{reportId}/resolve:
    post:
      summary: Resuelve el reporte
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - dismissed
                  - message_deleted
                  - channel_suspended
                  - user_suspended
                note:
                  type: string
                  maxLength: 200
      responses:
        '204':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /r/{code}/baja:
    get:
      summary: Página para dejar de recibir invitaciones por SMS (FR-035)
      security: []
      parameters:
      - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Página
          content:
            text/html:
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
      tags:
      - radio
    post:
      summary: Registra la baja del teléfono de la invitación
      security: []
      parameters:
      - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Página de confirmación
          content:
            text/html:
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
      tags:
      - radio

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    # 011 Radio Kyq
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9A-Za-z]{10}$
    TripId: { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    DriverId: { name: driverId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentId: { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    TripPaymentId: { name: tripPaymentId, in: path, required: true, schema: { type: string, format: uuid } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: string, format: uuid } }
    ShareToken: { name: token, in: path, required: true, schema: { type: string } }
    PassengerId: { name: passengerId, in: path, required: true, schema: { type: string, format: uuid } }
    PreconsultId: { name: preconsultId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    CooperativeId: { name: cooperativeId, in: path, required: true, schema: { type: string, format: uuid } }
    MembershipId: { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    CaseId: { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    BroadcastId: { name: broadcastId, in: path, required: true, schema: { type: string, format: uuid } }
    DomainId: { name: domainId, in: path, required: true, schema: { type: string, format: uuid } }
    ReservationId: { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    MirrorDomainInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [api_url, realtime_url, active]
            properties:
              api_url: { type: string, description: 'https://dominio sin ruta' }
              realtime_url: { type: string, description: 'wss://dominio/connection/websocket' }
              active: { type: boolean }
    Phone:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone_e164]
            properties:
              phone_e164: { type: string }
    Route:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RouteRequest' }
    ModerationReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, description: '3 a 500 caracteres tras recortar espacios' }
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision: { type: string, enum: [approve, reject] }
              reason: { type: string, description: Obligatorio al rechazar }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Tokens:
      description: Tokens de sesión
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token: { type: string }
              refresh_token: { type: string }
              role: { type: string, enum: [passenger, driver, admin] }
              scope: { type: string, enum: [support], description: '009: solo en la sesión de un suspendido' }
              radio_invites_applied:
                type: array
                items: { type: string, format: uuid }
                description: '011: conversaciones de Radio a las que llevaron las invitaciones enviadas a este teléfono'
    RealtimeToken:
      description: Token de Centrifugo
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
    Trip:
      description: Viaje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Trip' }

    Preconsult:
      description: Consulta de voz
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Preconsult' }
    PreconsultSettings:
      description: Ajustes de consultas de voz
      content:
        application/json:
          schema:
            type: object
            required: [accepts_preconsults, blocked_passenger_ids]
            properties:
              accepts_preconsults: { type: boolean }
              blocked_passenger_ids: { type: array, items: { type: string, format: uuid } }

    EmergencyContacts:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              contacts: { type: array, items: { $ref: '#/components/schemas/EmergencyContact' } }
    Duty:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              on_duty: { type: boolean }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    LocationFix:
      allOf:
        - $ref: '#/components/schemas/Point'
        - type: object
          properties:
            heading: { type: number }
            speed_mps: { type: number }
            recorded_at: { type: string, format: date-time }
            accuracy_m: { type: number, description: '010: precisión del GPS en metros (llegada automática con ≤ 50 m)' }
    RouteRequest:
      type: object
      required: [pickup, dropoff]
      properties:
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
    FareQuote:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        suggested_fare_minor: { type: integer, description: 'Con la tarifa preferencial si aplica (008)' }
        currency: { type: string }
        list_fare_minor: { type: integer, description: '008. Tarifa de la tabla' }
        preferential_discount_pct: { type: integer, minimum: 0, maximum: 30, description: '008. RN-KYQ-013' }
    DispatchSettings:
      type: object
      description: 008. Bolsa zonal, tarifa preferencial (RN-KYQ-013) y enlace para compartir
      required: [accepts_zone_pool, preferential_discount_pct, affiliate_link]
      properties:
        accepts_zone_pool: { type: boolean }
        preferential_discount_pct: { type: integer, minimum: 0, maximum: 30 }
        affiliate_link: { type: string, description: 'KYQ_PUBLIC_BASE_URL/a/{qr_token}' }
    AffiliationSource:
      type: string
      enum: [qr_scan, post_trip, link]
      description: 008. Origen de la afiliación
    FareTable:
      type: object
      required: [currency, base_minor, per_km_minor, per_minute_minor, minimum_minor]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        base_minor: { type: integer, minimum: 0 }
        per_km_minor: { type: integer, minimum: 0 }
        per_minute_minor: { type: integer, minimum: 0 }
        minimum_minor: { type: integer, minimum: 0 }
        rounding_minor: { type: integer, minimum: 1, default: 1, description: Se redondea al múltiplo más cercano }
    Presence:
      type: string
      enum: [offline, free, busy]
    DocType:
      type: string
      description: 'Cédula, licencia, SOAT, revisión técnico-mecánica y tarjeta de propiedad (002)'
      enum: [national_id, license, mandatory_insurance, technical_inspection, vehicle_registration]
    ChosenDriver:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        vehicle_description: { type: string }
        presence: { $ref: '#/components/schemas/Presence' }
        busy_until_estimate: { type: [string, 'null'], format: date-time }
        cooperative:
          description: 006. Cooperativa activa del conductor, para el selector de despacho
          oneOf: [ { $ref: '#/components/schemas/CooperativeRef' }, { type: 'null' } ]
        zone:
          description: '010: zona aproximada (centro del hexágono H3 de res. 8) solo si está libre con ubicación reciente; nunca su posición'
          oneOf: [ { $ref: '#/components/schemas/DriverZone' }, { type: 'null' } ]
    DriverMe:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        qr_token: { type: string }
        presence: { $ref: '#/components/schemas/Presence' }
        subscription_status: { type: string, enum: [active, grace_period, suspended] }
        paid_until: { type: [string, 'null'], format: date-time }
        can_go_online: { type: boolean }
        block_reason: { type: [string, 'null'], enum: [subscription_suspended, kyc_expired, null] }
        blocked_documents:
          type: array
          description: 002. Documentos obligatorios que bloquean ONLINE; vacío si están al día
          items: { $ref: '#/components/schemas/DocumentProblem' }
        documents:
          type: array
          description: |
            Vista de 001: aprobados de license, mandatory_insurance y vehicle_registration con
            vencimiento. El detalle completo de 002 está en GET /v1/driver/onboarding.
          items:
            type: object
            properties:
              doc_type: { $ref: '#/components/schemas/DocType' }
              expires_at: { type: string, format: date }
              approved: { type: boolean }
    FareProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        proposed_by: { type: string, enum: [driver, passenger] }
        amount_minor: { type: integer }
        status: { type: string, enum: [open, accepted, rejected, superseded, expired] }
        expires_at: { type: string, format: date-time }
    TripStatus:
      type: string
      enum: [REQUESTED, FARE_PENDING, NEGOTIATION_PENDING, NEGOTIATING, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
    Trip:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TripStatus' }
        passenger_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
        distance_m: { type: integer }
        duration_s: { type: integer }
        currency: { type: string }
        suggested_fare_minor: { type: integer }
        agreed_fare_minor: { type: [integer, 'null'] }
        driver_payout_minor: { type: [integer, 'null'] }
        platform_commission_minor: { type: integer, const: 0 }
        open_proposal: { oneOf: [ { $ref: '#/components/schemas/FareProposal' }, { type: 'null' } ] }
        offer_expires_at:
          type: [string, 'null']
          format: date-time
          description: Plazo de la respuesta pendiente (oferta 25 s; confirmación, aceptar negociar o propuesta 30 s)
        negotiation_expires_at: { type: [string, 'null'], format: date-time }
        cancel_reason:
          type: [string, 'null']
          description: 006 añade `no_driver_available` (la delegación no encontró compañero)
        dispatch: { type: string, enum: [chosen_driver, cooperative, zone_pool], description: '006; zone_pool en 008' }
        requested_driver_id: { type: string, format: uuid, description: 006. Conductor Elegido pedido }
        driver_name: { type: string, description: 006. Nombre del conductor actual (cambia al derivar) }
        cooperative_id: { type: [string, 'null'], format: uuid }
        cooperative_name: { type: [string, 'null'] }
        allow_delegation: { type: boolean, description: 006. Consentimiento del pasajero (RN-KYQ-008) }
        handover_count: { type: integer, minimum: 0, maximum: 3 }
        can_delegate: { type: boolean, description: 006. El conductor actual puede pasar la oferta }
        list_fare_minor: { type: integer, description: 008. Tarifa de la tabla }
        preferential_discount_pct: { type: integer, minimum: 0, maximum: 30, description: '008. Descuento preferencial aplicado (RN-KYQ-013)' }

    # --- 002 ---------------------------------------------------------------------------------
    DocumentProblem:
      type: object
      description: 'Documento obligatorio que bloquea ONLINE (RN-KYQ-016): falta aprobado o vencido'
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        problem: { type: string, enum: [missing, expired] }
    Vehicle:
      type: object
      required: [plate, brand, model, color, year]
      properties:
        plate: { type: string, description: 'ABC123 o ABC12D (se normaliza a mayúsculas sin espacios)' }
        brand: { type: string, maxLength: 40 }
        model: { type: string, maxLength: 40 }
        color: { type: string, maxLength: 30 }
        year: { type: integer, description: '1990 a año actual + 1' }
    Document:
      type: object
      description: Envío de un documento. `number` solo lo ven el conductor y los administradores (FR-011).
      properties:
        id: { type: string, format: uuid }
        doc_type: { $ref: '#/components/schemas/DocType' }
        number: { type: string }
        expires_at: { type: [string, 'null'], format: date }
        exempt_until: { type: [string, 'null'], format: date }
        status: { type: string, enum: [uploading, submitted, approved, rejected, superseded] }
        expired: { type: boolean, description: 'Solo aprobados: ya no está vigente' }
        legacy: { type: boolean, description: 'Migrado de 001 o marcador sin fotos: hay que subir el real' }
        reject_reason: { type: [string, 'null'] }
        submitted_at: { type: [string, 'null'], format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        photos:
          type: array
          description: URLs firmadas de lectura (5 min) de las fotos subidas
          items:
            type: object
            properties:
              side: { type: string, enum: [front, back] }
              url: { type: string }
    DocumentSlot:
      type: object
      description: Un tipo obligatorio; `current` es el aprobado y `latest` el envío más reciente si no es el aprobado
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        label: { type: string }
        current: { oneOf: [ { $ref: '#/components/schemas/Document' }, { type: 'null' } ] }
        latest: { oneOf: [ { $ref: '#/components/schemas/Document' }, { type: 'null' } ] }
        rejected_count: { type: integer }
        suggest_support: { type: boolean, description: 'Tras 3 rechazos del mismo documento' }
    Onboarding:
      type: object
      properties:
        status: { type: string, enum: [profile_incomplete, documents_pending, in_review, documents_ok] }
        vehicle: { oneOf: [ { $ref: '#/components/schemas/Vehicle' }, { type: 'null' } ] }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
        blocked_documents: { type: array, items: { $ref: '#/components/schemas/DocumentProblem' } }
        subscription_status: { $ref: '#/components/schemas/BillingStatus' }
        paid_until: { type: [string, 'null'], format: date-time }
        can_go_online: { type: boolean }
    KycQueueEntry:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        vehicle_plate: { type: string }
        pending_documents: { type: integer }
        oldest_submitted_at: { type: string, format: date-time }
    KycDriverFile:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        phone_e164: { type: string }
        status: { type: string, enum: [profile_incomplete, documents_pending, in_review, documents_ok] }
        vehicle: { oneOf: [ { $ref: '#/components/schemas/Vehicle' }, { type: 'null' } ] }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
        blocked_documents: { type: array, items: { $ref: '#/components/schemas/DocumentProblem' } }
    BillingStatus:
      type: string
      description: 'Estado de la suscripción en 002; `unpaid` = nunca ha pagado'
      enum: [active, grace, suspended, unpaid]
    Price:
      type: object
      properties:
        amount_minor: { type: integer }
        currency: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid, description: También es la referencia en Bold }
        amount_minor: { type: integer }
        currency: { type: string }
        method: { type: string, enum: [bold, manual] }
        status: { type: string, enum: [created, processing, approved, rejected, expired, voided, needs_review] }
        checkout_url: { type: [string, 'null'], description: Solo mientras está en curso }
        payment_method_detail: { type: [string, 'null'], description: 'CREDIT_CARD, PSE, NEQUI…; en manuales, el medio' }
        covers_from: { type: [string, 'null'], format: date-time }
        covers_until: { type: [string, 'null'], format: date-time }
        void_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          properties:
            manual_reference: { type: [string, 'null'] }
            review_note: { type: [string, 'null'], description: 'Por qué quedó en needs_review' }
            created_by: { type: string, format: uuid }
            voided_by: { type: [string, 'null'], format: uuid }
    SubscriptionView:
      type: object
      properties:
        status: { $ref: '#/components/schemas/BillingStatus' }
        paid_until: { type: [string, 'null'], format: date-time }
        grace_until: { type: [string, 'null'], format: date-time }
        price: { oneOf: [ { $ref: '#/components/schemas/Price' }, { type: 'null' } ] }
        can_pay: { type: boolean, description: 'Documentos al día, precio definido y Bold activo' }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    SubscriptionRow:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        phone_e164: { type: string }
        vehicle_plate: { type: string }
        status: { $ref: '#/components/schemas/BillingStatus' }
        paid_until: { type: [string, 'null'], format: date-time }
        grace_until: { type: [string, 'null'], format: date-time }
        last_payment:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, format: uuid }
                amount_minor: { type: integer }
                currency: { type: string }
                method: { type: string, enum: [bold, manual] }
                status: { type: string }
                created_at: { type: string, format: date-time }
    Notice:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: 'doc_expiring, doc_expired, doc_rejected, doc_approved, doc_legacy, sub_expiring, sub_grace, payment_approved, payment_rejected, payment_voided'
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    CostRate:
      type: object
      required: [concept, currency, unit_cost_micro, effective_from]
      properties:
        concept: { type: string, enum: [voice_minute, realtime_event, route_request, fixed_monthly] }
        currency: { type: string }
        unit_cost_micro: { type: integer, minimum: 0, description: Millonésimas de unidad mínima }
        effective_from: { type: string, format: date }
    CostBreakdown:
      type: object
      properties:
        month: { type: string }
        currency: { type: string }
        paid_minor: { type: integer, description: 'Pagos aprobados cuyo periodo empieza en el mes' }
        items:
          type: array
          items:
            type: object
            properties:
              concept: { type: string, enum: [voice_minute, realtime_event, route_request, fixed_monthly] }
              usage: { type: number, description: 'minutos, eventos o peticiones; 1 para el fijo' }
              cost_minor: { type: number }
        total_cost_minor: { type: number }
        margin_minor: { type: number }
    DriverCost:
      allOf:
        - $ref: '#/components/schemas/CostBreakdown'
        - type: object
          properties:
            driver_id: { type: string, format: uuid }
            display_name: { type: string }
            negative_margin: { type: boolean }

    # --- 007 ---------------------------------------------------------------------------------
    PttCredentials:
      type: object
      required: [url, token, room]
      properties:
        url: { type: string }
        token: { type: string }
        room: { type: string, example: 'pre-0192...' }
        closes_at: { type: [string, 'null'], format: date-time }
    Preconsult:
      type: object
      required: [id, passenger_id, passenger_name, driver_id, driver_name, status, opened_at, join_deadline, closes_at]
      properties:
        id: { type: string, format: uuid }
        passenger_id: { type: string, format: uuid }
        passenger_name: { type: string }
        driver_id: { type: string, format: uuid }
        driver_name: { type: string }
        status: { type: string, enum: [open, answered, unanswered, missed] }
        opened_at: { type: string, format: date-time }
        join_deadline: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        joined_at: { type: [string, 'null'], format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        close_reason:
          type: [string, 'null']
          enum: [ended_by_passenger, ended_by_driver, disabled, missed, driver_unavailable, expired, null]
    TowerTotals:
      type: object
      required: [online, free, busy, without_location, stale, active_trips, requests, unserved_requests]
      properties:
        online: { type: integer }
        free: { type: integer }
        busy: { type: integer }
        without_location: { type: integer, description: 'ONLINE sin ninguna ubicación aún' }
        stale: { type: integer, description: 'ONLINE con ubicación de hace más de stale_after_seconds' }
        active_trips: { type: integer }
        requests: { type: integer, description: 'Solicitudes de la ventana (última hora)' }
        unserved_requests: { type: integer }
    TowerCell:
      type: object
      required: [cell, center, boundary, free_drivers, busy_drivers, active_trips, requests, unserved_requests, pressure, level]
      properties:
        cell: { type: string, description: 'Índice H3 en hexadecimal', example: '8866e42b9bfffff' }
        center: { $ref: '#/components/schemas/Point' }
        boundary:
          type: array
          description: 'Vértices en sentido antihorario, sin cerrar el anillo'
          items: { $ref: '#/components/schemas/Point' }
        free_drivers: { type: integer }
        busy_drivers: { type: integer }
        active_trips: { type: integer }
        requests: { type: integer }
        unserved_requests: { type: integer }
        pressure: { type: [number, 'null'], description: 'Solicitudes por conductor libre; null sin libres' }
        level: { type: string, enum: [none, balanced, high, no_supply] }
        trip_ids:
          type: array
          description: '009: viajes activos del hexágono, para abrirlos desde la torre'
          items: { type: string, format: uuid }
    TowerDriver:
      type: object
      required: [driver_id, display_name, presence, lat, lng, location_at, stale, cell]
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        presence: { type: string, enum: [free, busy] }
        lat: { type: number }
        lng: { type: number }
        location_at: { type: string, format: date-time }
        stale: { type: boolean }
        cell: { type: string }
        active_trip_id: { type: [string, 'null'], format: uuid, description: '009: viaje activo del conductor ocupado' }
    TowerSnapshot:
      type: object
      required: [generated_at, resolution, window_minutes, stale_after_seconds, totals, cells, drivers]
      properties:
        generated_at: { type: string, format: date-time }
        resolution: { type: integer }
        window_minutes: { type: integer }
        stale_after_seconds: { type: integer }
        totals: { $ref: '#/components/schemas/TowerTotals' }
        cells: { type: array, items: { $ref: '#/components/schemas/TowerCell' } }
        drivers: { type: array, items: { $ref: '#/components/schemas/TowerDriver' } }
    FinanceConceptCost:
      type: object
      required: [concept, cost_minor]
      properties:
        concept: { type: string, enum: [voice_minute, realtime_event, route_request, fixed_monthly] }
        cost_minor: { type: number }
    FinanceMonth:
      type: object
      required: [month, revenue_minor, infra_cost_minor, margin_minor, margin_pct, drivers, active_drivers,
                 paying_drivers, negative_margin_drivers, cost_per_active_driver_minor,
                 revenue_per_paying_driver_minor, cost_by_concept, rates_missing]
      properties:
        month: { type: string, example: '2026-10' }
        revenue_minor: { type: integer }
        infra_cost_minor: { type: number }
        margin_minor: { type: number }
        margin_pct: { type: [number, 'null'], description: 'Margen / ingresos × 100; null sin ingresos' }
        drivers: { type: integer, description: 'Conductores existentes al cierre del mes' }
        active_drivers: { type: integer }
        paying_drivers: { type: integer }
        negative_margin_drivers: { type: integer }
        cost_per_active_driver_minor: { type: [number, 'null'] }
        revenue_per_paying_driver_minor: { type: [number, 'null'] }
        cost_by_concept: { type: array, items: { $ref: '#/components/schemas/FinanceConceptCost' } }
        rates_missing: { type: boolean, description: 'Sin ninguna tarifa de costo vigente en el mes' }
    FinanceReport:
      type: object
      required: [currency, months, totals]
      properties:
        currency: { type: string }
        months: { type: array, items: { $ref: '#/components/schemas/FinanceMonth' } }
        totals:
          type: object
          required: [revenue_minor, infra_cost_minor, margin_minor, margin_pct]
          properties:
            revenue_minor: { type: integer }
            infra_cost_minor: { type: number }
            margin_minor: { type: number }
            margin_pct: { type: [number, 'null'] }
    CrmWeek:
      type: object
      required: [week_start, created, removed, active_end]
      properties:
        week_start: { type: string, format: date }
        created: { type: integer }
        removed: { type: integer }
        active_end: { type: integer }
    CrmReport:
      type: object
      required: [from, to, affiliations, repeat, sc008, churned_drivers, inactive_chosen_drivers]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        affiliations:
          type: object
          required: [active_now, active_at_start, created, removed, net, churn_rate, weekly]
          properties:
            active_now: { type: integer }
            active_at_start: { type: integer }
            created: { type: integer }
            removed: { type: integer }
            net: { type: integer }
            churn_rate: { type: [number, 'null'], description: 'Bajas / (activas al inicio + nuevas)' }
            weekly: { type: array, items: { $ref: '#/components/schemas/CrmWeek' } }
            created_by_source:
              type: object
              description: '008. Nuevas afiliaciones del periodo por origen; suman `created`'
              properties:
                qr_scan: { type: integer }
                post_trip: { type: integer }
                link: { type: integer }
        repeat:
          type: object
          required: [pairs, repeat_pairs, repeat_rate, completed_trips, avg_trips_per_pair]
          properties:
            pairs: { type: integer }
            repeat_pairs: { type: integer }
            repeat_rate: { type: [number, 'null'] }
            completed_trips: { type: integer }
            avg_trips_per_pair: { type: [number, 'null'] }
        sc008:
          type: object
          required: [matured, with_request_30d, rate, target, met, pending]
          properties:
            matured: { type: integer, description: 'Afiliaciones del periodo con 30 días cumplidos' }
            with_request_30d: { type: integer }
            rate: { type: [number, 'null'] }
            target: { type: number }
            met: { type: [boolean, 'null'] }
            pending: { type: integer, description: 'Afiliaciones del periodo de menos de 30 días' }
        churned_drivers:
          type: array
          items:
            type: object
            required: [driver_id, display_name, removed, active_now]
            properties:
              driver_id: { type: string, format: uuid }
              display_name: { type: string }
              removed: { type: integer }
              active_now: { type: integer }
        inactive_chosen_drivers:
          type: array
          items:
            type: object
            required: [driver_id, display_name, active_affiliations, last_completed_at]
            properties:
              driver_id: { type: string, format: uuid }
              display_name: { type: string }
              active_affiliations: { type: integer }
              last_completed_at: { type: [string, 'null'], format: date-time }
    ModeratedUser:
      type: object
      required: [user_id, display_name, phone_e164, role, created_at, suspended_at, suspension_reason]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        phone_e164: { type: string }
        role: { type: string, enum: [passenger, driver, admin] }
        created_at: { type: string, format: date-time }
        suspended_at: { type: [string, 'null'], format: date-time }
        suspension_reason: { type: [string, 'null'] }
    ModerationAction:
      type: object
      required: [id, action, reason, actor_id, actor_name, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [suspend, reactivate] }
        reason: { type: string }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        created_at: { type: string, format: date-time }
    HealthCheck:
      type: object
      required: [name, status, latency_ms, detail]
      properties:
        name: { type: string, enum: [database, centrifugo, livekit, osrm, storage, bold] }
        status: { type: string, enum: [ok, down, disabled] }
        latency_ms: { type: [integer, 'null'] }
        detail: { type: string }
    HealthReport:
      type: object
      required: [status, checked_at, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checked_at: { type: string, format: date-time }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthCheck' } }
    CooperativeRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    CooperativeStatus:
      type: string
      enum: [active, suspended]
    CooperativeRole:
      type: string
      enum: [member, coordinator]
    MembershipStatus:
      type: string
      enum: [pending, active, rejected, cancelled, left, removed]
    CooperativeInput:
      type: object
      required: [name, city_code]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        city_code: { type: string }
        nit: { type: [string, 'null'], maxLength: 20 }
    Cooperative:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city_code: { type: string }
        nit: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CooperativeStatus' }
        members_count: { type: integer }
        pending_count: { type: integer }
        created_at: { type: string, format: date-time }
    CooperativeMember:
      type: object
      properties:
        membership_id: { type: string, format: uuid }
