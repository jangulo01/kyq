          type: string
        channel_name:
          type:
          - string
          - 'null'
        invitee_kind:
          type: string
          enum:
          - driver
          - passenger
    RadioSettingsInput:
      type: object
      properties:
        trial_policy:
          type: string
          enum:
          - trial
          - subscription_only
          - listen_only
        trial_days:
          type: integer
          minimum: 1
          maximum: 90
        passengers_in_channels:
          type: string
          enum:
          - none
          - listen_only
          - all_roles
        retention_days:
          type: integer
          enum:
          - 7
          - 30
          - 90
    RadioSettings:
      allOf:
      - $ref: '#/components/schemas/RadioSettingsInput'
      - type: object
        properties:
          updated_at:
            type: string
            format: date-time
          updated_by_name:
            type: string
          estimated_monthly_cost_minor:
            type: object
            description: Costo estimado por retención (7, 30, 90) con los últimos 30 días
            additionalProperties:
              type: integer
    BulkUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        status:
          type: string
          enum:
          - validated
          - sending
          - done
        rows_total:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
        created_at:
          type: string
          format: date-time
    BulkUploadDetail:
      allOf:
      - $ref: '#/components/schemas/BulkUpload'
      - type: object
        properties:
          rows:
            type: array
            items:
              type: object
              properties:
                line:
                  type: integer
                name:
                  type: string
                phone_masked:
                  type: string
                  description: 'Ej.: +57 300 *** **12'
                kind:
                  type: string
                  enum:
                  - driver
                  - passenger
                channel:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
                status:
                  type: string
                  enum:
                  - pending
                  - sent
                  - failed
                  - accepted
                  - already_member
                  - expired
                error:
                  type:
                  - string
                  - 'null'
    Report:
      type: object
      properties:
