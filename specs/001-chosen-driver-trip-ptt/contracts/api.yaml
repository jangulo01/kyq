        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
    post:
      summary: Sube y valida un CSV sin enviar nada (FR-033); máx. 2 000 filas
      description: |
        Columnas `nombre,telefono,tipo,canal,rol` (coma o punto y coma, con o sin encabezado).
        Un canal que no existe se crea al confirmar con la fila de rol `dueño`, que debe usar ya
