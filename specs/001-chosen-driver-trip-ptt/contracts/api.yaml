        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: Creado
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/radio/channels/{conversationId}:
    patch:
      summary: Edita nombre, descripción, foto, modo de entrada o rol máximo de pasajeros (dueño)
