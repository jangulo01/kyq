        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
    put:
      summary: Cambia la configuración; queda en la bitácora
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadioSettingsInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioSettings'
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - radio
  /v1/admin/radio/bulk-uploads:
    get:
      summary: Cargas masivas con totales (FR-034)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkUpload'
