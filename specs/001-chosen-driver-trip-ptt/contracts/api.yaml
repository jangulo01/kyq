openapi: 3.1.0
info:
  title: Kyq API (MVP 001 + 002 alta, KYC y suscripción)
  version: 0.2.0
  description: |
    API REST del MVP Conductor Elegido + Viaje + PTT. Todas las rutas salvo /v1/auth/* exigen
    `Authorization: Bearer <access_token>`. Errores con cuerpo `Error`.

    Autorización obligatoria en todo `/v1/trips/{tripId}/*`:
    - El llamante MUST ser el pasajero o el conductor del viaje; si no, `404 not_found`
      (no se revela que el viaje existe).
    - Solo conductor: `accept`, `reject`, `negotiation`, `arrive`, `start`, `complete`.
    - Solo pasajero: `negotiation/response`.
    - `proposals/{proposalId}/{decision}`: solo la parte que NO hizo la propuesta
      (`proposed_by` distinto del rol del llamante); si no, `403 forbidden`.
    - `proposals`, `cancel`, `ptt/token`, `ptt/floor`: cualquiera de las dos partes.
    - Acción válida para el rol pero no para el estado actual: `409`.
    Rutas `/v1/driver/*` exigen rol `driver`; `/v1/admin/*` exigen rol `admin` (`403` si no).
    Pago del viaje (004, `/v1/trips/{tripId}/payment*`): solo pasajero `bold`, `refresh` y
    `cash`; solo conductor `cash-received`, `cash-dispute` y `unpaid` (`403 forbidden` a la otra
    parte); `409 invalid_state` si el estado del pago no lo permite.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /v1/auth/otp/request:
    post:
      summary: Envía un código OTP por SMS (FR-001)
      description: |
        Límites por hora: 5 por teléfono, 20 por IP de origen y 500 en total (429 `rate_limited`).
        Solo se envían códigos a países atendidos (400 `country_not_served`).
      security: []
      requestBody: { $ref: '#/components/requestBodies/Phone' }
      responses:
        '204': { description: Código enviado }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/otp/verify:
    post:
      summary: Verifica el OTP y emite tokens (FR-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, code]
              properties:
                phone_e164: { type: string, example: '+573001234567' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                display_name: { type: string, description: Obligatorio en el primer registro }
                role:
                  type: string
                  enum: [passenger, driver]
                  description: |
                    002 (FR-001, FR-003). Sin `role`: entra con el rol que ya tiene (un teléfono
                    nuevo queda como pasajero). `driver` en un teléfono nuevo crea el conductor
                    (sin vehículo, con QR). Si el teléfono ya existe con otro rol: 409.
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: '`phone_has_other_role`: el teléfono ya existe con otro rol'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/refresh:
    post:
      summary: Rota el token de refresco
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/realtime/token:
    post:
      summary: Token de conexión a Centrifugo
      responses:
        '200': { $ref: '#/components/responses/RealtimeToken' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/realtime/subscription-token:
    post:
      summary: Token de suscripción a un canal autorizado (ver realtime.md)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, example: 'driver_presence:0192...' }
      responses:
        '200': { $ref: '#/components/responses/RealtimeToken' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/driver/me:
    get:
      summary: Perfil, QR, suscripción, documentos y si puede ponerse ONLINE (FR-002, FR-005)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverMe' }
  /v1/driver/presence:
    post:
      summary: Cambia presencia ONLINE/OFFLINE (FR-002, FR-003)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
      responses:
        '200':
          description: Presencia actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  presence: { $ref: '#/components/schemas/Presence' }
        '409':
          description: |
            Bloqueado; `code` = subscription_suspended | kyc_expired | trip_in_progress. Con
            `kyc_expired`, `message` nombra el documento (p. ej. "SOAT vencido: envía el nuevo").
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/driver/location:
    post:
      summary: Posición del conductor ONLINE, cada 3 s (FR-008, FR-014)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationFix' }
      responses:
        '204': { description: Aceptada }
        '409': { description: '`offline`: hay que estar ONLINE' }
  /v1/driver/clients:
    get:
      summary: Cartera de pasajeros afiliados (FR-007)
      responses:
        '403': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    passenger_id: { type: string, format: uuid }
                    display_name: { type: string }
                    affiliated_at: { type: string, format: date-time }

  /v1/affiliations:
    get:
      summary: Mis Conductores Elegidos con presencia actual (FR-008)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChosenDriver' }
    post:
      summary: Afilia un conductor por su QR (FR-006)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string }
      responses:
        '201':
          description: Afiliación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChosenDriver' }
        '200':
          description: Ya estaba afiliado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChosenDriver' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: '`driver_not_available`: el conductor aún no puede recibir clientes (documentos o suscripción, FR-004 de 002)' }
  /v1/affiliations/{driverId}:
    delete:
      summary: Elimina un conductor de la lista (FR-006)
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/Error' }

  /v1/fares/quote:
    post:
      summary: Tarifa sugerida para una ruta (FR-010)
      requestBody: { $ref: '#/components/requestBodies/Route' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareQuote' }

  /v1/trips:
    post:
      summary: Solicita un viaje a un Conductor Elegido libre (FR-009, FR-011)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RouteRequest'
                - type: object
                  required: [driver_id]
                  properties:
                    driver_id: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Trip' }
        '409':
          description: '`code` = driver_not_free | not_affiliated | passenger_has_active_trip'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/trips/{tripId}:
    get:
      summary: Estado actual del viaje
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200': { $ref: '#/components/responses/Trip' }

  /v1/trips/{tripId}/accept:
    post:
      summary: Conductor acepta; con `fare_minor` distinto pasa a FARE_PENDING (FR-010a)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fare_minor: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/trips/{tripId}/reject:
    post:
      summary: Conductor rechaza la oferta (FR-011)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200': { $ref: '#/components/responses/Trip' }
  /v1/trips/{tripId}/negotiation:
    post:
      summary: Conductor propone negociar; pasa a NEGOTIATION_PENDING (FR-010c)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200': { $ref: '#/components/responses/Trip' }
  /v1/trips/{tripId}/negotiation/response:
    post:
      summary: Pasajero acepta o rechaza negociar (FR-010c)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Trip' }
  /v1/trips/{tripId}/proposals:
    post:
      summary: Nueva propuesta o contrapropuesta en NEGOTIATING (FR-010c)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Propuesta abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareProposal' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/trips/{tripId}/proposals/{proposalId}/{decision}:
    post:
      summary: La otra parte acepta o rechaza una propuesta (FR-010a, FR-010c)
      parameters:
        - { $ref: '#/components/parameters/TripId' }
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [accept, reject] } }
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/trips/{tripId}/{transition}:
    post:
      summary: Avance del viaje por el conductor (FR-013)
      parameters:
        - { $ref: '#/components/parameters/TripId' }
        - { name: transition, in: path, required: true, schema: { type: string, enum: [arrive, start, complete] } }
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/trips/{tripId}/cancel:
    post:
      summary: Cancelación por cualquiera de las partes antes de IN_PROGRESS
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/trips/active:
    get:
      summary: Viaje sin terminar del llamante (pasajero o conductor), para retomarlo al reabrir la app
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '204': { description: Sin viaje activo }

  /v1/trips/{tripId}/ptt/token:
    post:
      summary: Credenciales para la sala de voz del viaje (FR-016, FR-020)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: |
            El token permite escuchar y enviar mensajes de datos, no publicar audio: el backend
            concede publicar micrófono solo a quien tiene el turno. Caduca a los 10 min o al
            cierre del canal (lo que llegue antes); LiveKit renueva la sesión conectada y las
            apps piden otro token al reconectar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: 'wss://voice.kyq.example' }
                  token: { type: string }
                  room: { type: string, example: 'trip-0192...' }
                  closes_at:
                    type: [string, 'null']
                    format: date-time
                    description: Null mientras el viaje sigue activo.
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'El canal aún no está abierto (viaje sin aceptar), `ptt_not_open`' }
        '410': { description: Canal cerrado }
        '503': { description: 'Servidor de voz no disponible, `ptt_unavailable`' }
  /v1/trips/{tripId}/ptt/floor:
    post:
      summary: Pide el turno de palabra (FR-017)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Turno concedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'Canal ocupado por la otra parte (`ptt_busy`) o aún sin abrir (`ptt_not_open`)' }
        '410': { description: Canal cerrado }
        '503': { description: 'No se pudo dar permiso de micrófono en la sala, `ptt_unavailable`' }
    delete:
      summary: Libera el turno (sin efecto si el llamante no lo tiene)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '204': { description: Liberado }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: 'LiveKit no confirmó la retirada del permiso; el turno sigue y caduca solo, `ptt_unavailable`' }

  /v1/admin/usage:
    get:
      summary: Coste por conductor entre dos fechas (constitución VII)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Por defecto hace 30 días' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Por defecto hoy (UTC)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    driver_id: { type: [string, 'null'], description: 'Null: cotizaciones antes de elegir conductor' }
                    display_name: { type: string }
                    voice_minutes: { type: number, description: Minutos de participante en LiveKit de sus viajes (ambas partes) }
                    realtime_events: { type: integer }
                    route_requests: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/livekit/webhook:
    post:
      summary: Webhook de LiveKit (participant_left) para medir minutos de voz
      description: Sin token Kyq; LiveKit firma la llamada con un JWT de su clave de API cuyo claim sha256 es el del cuerpo.
      security: []
      responses:
        '200': { description: Recibido }
        '401': { $ref: '#/components/responses/Error' }

  /v1/admin/drivers:
    get:
      summary: Lista de conductores con suscripción y documentos (FR-004)
      responses:
        '200': { description: OK }
    post:
      summary: Alta de conductor por un administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, display_name, vehicle_plate, vehicle_description]
              properties:
                phone_e164: { type: string }
                display_name: { type: string }
                vehicle_plate: { type: string }
                vehicle_description: { type: string }
      responses:
        '201': { description: Creado }
  /v1/admin/drivers/{driverId}/subscription:
    put:
      summary: Registra el pago de la suscripción (FR-004)
      deprecated: true
      description: |
        Heredada de 001 para el panel actual: fija `paid_until` sin pago asociado. Desde 002 se usa
        el pago manual (`POST /v1/admin/drivers/{driverId}/payments`), que queda auditado.
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid_until]
              properties:
                paid_until: { type: string, format: date-time }
      responses:
        '200': { description: OK }
  /v1/admin/drivers/{driverId}/documents/{docType}:
    put:
      summary: Aprueba un documento y su vencimiento (FR-004)
      description: |
        Heredada de 001. Desde 002 aprobar crea una versión aprobada nueva sin fotos (reemplaza la
        anterior) y `approved: false` retira la aprobación vigente. `expires_at` es obligatorio al
        aprobar salvo `national_id` y `vehicle_registration`. El flujo nuevo es la cola KYC.
      parameters:
        - { $ref: '#/components/parameters/DriverId' }
        - { name: docType, in: path, required: true, schema: { $ref: '#/components/schemas/DocType' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                expires_at: { type: [string, 'null'], format: date }
                approved: { type: boolean }
      responses:
        '200': { description: OK }
  /v1/admin/fare-tables/{cityCode}:
    put:
      summary: Define la tabla de tarifas de la ciudad (FR-010b)
      parameters:
        - { name: cityCode, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FareTable' }
      responses:
        '200': { description: OK }

  # --- 002: alta autónoma, KYC, suscripción con Bold, avisos y costos -------------------------

  /v1/driver/vehicle:
    put:
      summary: Datos del vehículo (FR-002); obligatorios antes de enviar documentos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vehicle' }
      responses:
        '200':
          description: Vehículo guardado (placa normalizada en mayúsculas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/driver/onboarding:
    get:
      summary: Estado de alta, documentos por tipo, bloqueos y suscripción
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/driver/documents:
    post:
      summary: Inicia un envío de documento y devuelve URLs firmadas de subida por foto
      description: |
        `expires_at` es obligatorio salvo `national_id` y `vehicle_registration` (se ignora en
        esos tipos) y debe ser posterior a hoy. Cada URL admite un `PUT` con
        `Content-Type: image/jpeg` (≤ 2 MB) durante 10 min. Un envío a medias del mismo tipo se
        descarta; si hay uno en revisión, 409 `document_in_review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type, number, sides]
              properties:
                doc_type: { $ref: '#/components/schemas/DocType' }
                number: { type: string, maxLength: 40 }
                expires_at: { type: [string, 'null'], format: date }
                sides: { type: array, items: { type: string, enum: [front, back] }, minItems: 1, maxItems: 2 }
      responses:
        '201':
          description: Documento en `uploading`
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  uploads:
                    type: array
                    items:
                      type: object
                      properties:
                        side: { type: string, enum: [front, back] }
                        url: { type: string, description: 'PUT image/jpeg, ≤ 2 MB, caduca a los 10 min' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: '`vehicle_required` o `document_in_review`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/driver/documents/{documentId}/submit:
    post:
      summary: Confirma que las fotos están subidas; pasa a `submitted` (entra en la cola)
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      responses:
        '200':
          description: Documento en revisión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`photos_missing`, `photo_invalid` (no JPEG o > 2 MB; se borra) o `invalid_state`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/driver/subscription:
    get:
      summary: Estado, precio vigente y pagos del conductor (FR-019, FR-020)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionView' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/driver/payments:
    post:
      summary: Crea un pago con Bold al precio vigente y devuelve la URL de checkout (FR-014)
      description: El enlace de Bold caduca a los 30 min. Abrir `checkout_url` en una Custom Tab.
      responses:
        '201':
          description: Pago `created`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409':
          description: '`documents_not_ok`, `payment_in_progress` o `price_not_set`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`bold_unavailable`: Bold desactivado o sin respuesta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/driver/payments/{paymentId}/refresh:
    post:
      summary: Consulta a Bold el estado del pago ahora (al volver de la Custom Tab)
      parameters: [ { $ref: '#/components/parameters/PaymentId' } ]
      responses:
        '200':
          description: Pago actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/driver/costs:
    get:
      summary: Costo medido del conductor en un mes frente a lo pagado (RN-KYQ-004)
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }, description: 'Por defecto el mes en curso (UTC)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostBreakdown' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/driver/notices:
    get:
      summary: Avisos del conductor, recientes primero (máx. 100)
      description: También llegan en vivo como `notice.created` por el canal `user:{id}`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Notice' } }
  /v1/driver/notices/{noticeId}/read:
    post:
      summary: Marca un aviso como leído
      parameters: [ { name: noticeId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/Error' }

  /v1/billing/bold/webhook:
    post:
      summary: Webhook de Bold (producción). Firma `x-bold-signature`
      description: |
        Sin token Kyq. Firma = hex(HMAC-SHA256(llave secreta, base64(cuerpo))); en sandbox la llave
        es vacía. Solo existe si `KYQ_BOLD_ENV` tiene valor. Eventos: SALE_APPROVED, SALE_REJECTED,
        VOID_APPROVED (VOID_REJECTED y referencias desconocidas se aceptan y se ignoran).
      security: []
      parameters:
        - { name: x-bold-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Recibido (también si ya estaba procesado) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/admin/kyc/queue:
    get:
      summary: Conductores con documentos en revisión, del más antiguo al más reciente (FR-008)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/KycQueueEntry' } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/kyc/drivers/{driverId}:
    get:
      summary: Expediente con documentos y URLs firmadas de lectura de sus fotos (5 min)
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDriverFile' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/kyc/documents/{documentId}/review:
    post:
      summary: Aprueba o rechaza un documento (FR-008, FR-009, FR-012)
      description: |
        Al aprobar se pueden corregir `number`, `expires_at` y `exempt_until` (solo revisión
        técnico-mecánica); un campo ausente se conserva y `null` lo borra. Aprobar reemplaza
        (`superseded`) el aprobado anterior del mismo tipo.
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, description: Obligatorio al rechazar (máx. 200) }
                number: { type: string }
                expires_at: { type: [string, 'null'], format: date }
                exempt_until: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Documento revisado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`invalid_state`: no está en `submitted`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/subscriptions:
    get:
      summary: Suscripciones por estado con vencimiento y último pago (FR-022)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, grace, suspended, unpaid] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SubscriptionRow' } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/admin/drivers/{driverId}/payments:
    get:
      summary: Historial de pagos de un conductor
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminPayment' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Registra un pago manual al precio vigente y extiende la suscripción (FR-021)
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method_detail, reference]
              properties:
                method_detail: { type: string, example: efectivo, maxLength: 40 }
                reference: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Pago aprobado y suscripción extendida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/admin/payments/{paymentId}/void:
    post:
      summary: Anula un pago aprobado con motivo y recalcula el vencimiento (FR-021)
      parameters: [ { $ref: '#/components/parameters/PaymentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 200 } } }
      responses:
        '200':
          description: Pago anulado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`not_approved`: solo pagos aprobados'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/admin/subscription-prices/{cityCode}:
    put:
      summary: Nuevo precio mensual con fecha de vigencia (FR-013)
      description: COP en centavos y sin fracción de peso (múltiplo de 100). Sin `effective_from`, desde ya.
      parameters: [ { name: cityCode, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, amount_minor]
              properties:
                currency: { type: string }
                amount_minor: { type: integer, minimum: 1 }
                effective_from: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_code: { type: string }
                  currency: { type: string }
                  amount_minor: { type: integer }
                  effective_from: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/cost-rates:
    get:
      summary: Tarifas de costo vigentes e históricas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CostRate' } }
    put:
      summary: Nueva tarifa de un concepto con fecha de vigencia (FR-024)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostRate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostRate' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/admin/costs:
    get:
      summary: Precio cobrado, costo por concepto y margen por conductor y mes (FR-026)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DriverCost' } }
        '400': { $ref: '#/components/responses/Error' }

  # --- 004: pago del viaje con Bold o en efectivo ---------------------------------------------
  /v1/trips/{tripId}/payment:
    get:
      summary: Pago del viaje (pasajero o conductor del viaje)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '404':
          description: '`not_found`: no es parte del viaje o el viaje no tiene pago (no completado o anterior a 004)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/trips/{tripId}/payment/bold:
    post:
      summary: El pasajero inicia el pago con Bold y recibe la URL de checkout (FR-003)
      description: |
        Crea un enlace de Bold por la tarifa acordada (caduca a los 30 min). Si ya hay un enlace
        vigente, lo devuelve sin crear otro. Abrir `checkout_url` en una Custom Tab.
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Pago `bold_in_progress` con `checkout_url`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`invalid_state` o `method_not_accepted`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`bold_unavailable`: Bold desactivado o sin respuesta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/trips/{tripId}/payment/refresh:
    post:
      summary: Consulta a Bold el estado del enlace ahora (al volver del checkout)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Pago actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/trips/{tripId}/payment/cash:
    post:
      summary: El pasajero reporta "Pagué en efectivo" (FR-004)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Pago `cash_reported`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`invalid_state`, `method_not_accepted` o `bold_in_progress` (hay un enlace vigente)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/trips/{tripId}/payment/cash-received:
    post:
      summary: El conductor confirma "Recibí el efectivo" (FR-005)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Pago `paid` en efectivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/trips/{tripId}/payment/cash-dispute:
    post:
      summary: El conductor responde "No recibí el efectivo" a un reporte del pasajero (FR-005)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Pago `disputed`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/trips/{tripId}/payment/unpaid:
    post:
      summary: El conductor marca "No me pagó" un viaje sin reporte (FR-006)
      parameters: [ { $ref: '#/components/parameters/TripId' } ]
      responses:
        '200':
          description: Pago `unpaid`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPayment' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/trip-payments/pending:
    get:
      summary: Viajes del pasajero sin pagar (pendiente, no pagado o Bold en curso), recientes primero (FR-016)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TripPayment' } }
        '403': { $ref: '#/components/responses/Error' }

  /v1/driver/payment-methods:
    get:
      summary: Medios de pago que acepta el conductor (FR-018)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethods' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Cambia los medios aceptados; al menos uno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepts_cash, accepts_bold]
              properties:
                accepts_cash: { type: boolean }
                accepts_bold: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethods' }
        '400':
          description: '`no_method`: debe aceptar al menos uno'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/driver/settlement:
    get:
      summary: Saldo por girar, libro y pagos de viajes recientes del conductor (FR-013)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSettlement' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/trip-payments:
    get:
      summary: Pagos de viajes por estado, recientes primero (máx. 200) (FR-017)
      parameters:
        - name: status
          in: query
          description: '`issues` = unpaid, disputed y needs_review'
          schema:
            type: string
            enum: [pending, bold_in_progress, cash_reported, paid, unpaid, disputed, needs_review, voided, issues]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminTripPayment' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/admin/trip-payments/{tripPaymentId}/resolve:
    post:
      summary: Resuelve una disputa o un no pagado (pagado en efectivo o no pagado) con nota (FR-017)
      parameters: [ { $ref: '#/components/parameters/TripPaymentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome: { type: string, enum: [paid, unpaid] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pago resuelto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTripPayment' }
        '400':
          description: '`note_required` o `invalid_outcome`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/admin/trip-payments/{tripPaymentId}/void:
    post:
      summary: Anula un pago con Bold reembolsado en Bold y debita el abono (FR-014)
      parameters: [ { $ref: '#/components/parameters/TripPaymentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 200 } } }
      responses:
        '200':
          description: Pago anulado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTripPayment' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`invalid_state`: solo pagos con Bold pagados o en revisión'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/admin/settlements:
    get:
      summary: Saldo por girar de cada conductor y moneda; con saldo primero (FR-012)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SettlementRow' } }

  /v1/admin/drivers/{driverId}/settlement:
    get:
      summary: Libro y pagos de viajes de un conductor
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSettlement' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/admin/drivers/{driverId}/payouts:
    post:
      summary: Registra un giro hecho por fuera (transferencia) que no supere el saldo (FR-012)
      parameters: [ { $ref: '#/components/parameters/DriverId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, currency, reference]
              properties:
                amount_minor: { type: integer, minimum: 1 }
                currency: { type: string }
                reference: { type: string, maxLength: 80 }
                note: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Giro registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400':
          description: '`invalid_payout`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: '`exceeds_balance`: el valor supera el saldo por girar'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    TripId: { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    DriverId: { name: driverId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentId: { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    TripPaymentId: { name: tripPaymentId, in: path, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    Phone:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone_e164]
            properties:
              phone_e164: { type: string }
    Route:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RouteRequest' }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Tokens:
      description: Tokens de sesión
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token: { type: string }
              refresh_token: { type: string }
              role: { type: string, enum: [passenger, driver, admin] }
    RealtimeToken:
      description: Token de Centrifugo
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
    Trip:
      description: Viaje
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Trip' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    LocationFix:
      allOf:
        - $ref: '#/components/schemas/Point'
        - type: object
          properties:
            heading: { type: number }
            speed_mps: { type: number }
            recorded_at: { type: string, format: date-time }
    RouteRequest:
      type: object
      required: [pickup, dropoff]
      properties:
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
    FareQuote:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        suggested_fare_minor: { type: integer }
        currency: { type: string }
    FareTable:
      type: object
      required: [currency, base_minor, per_km_minor, per_minute_minor, minimum_minor]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        base_minor: { type: integer, minimum: 0 }
        per_km_minor: { type: integer, minimum: 0 }
        per_minute_minor: { type: integer, minimum: 0 }
        minimum_minor: { type: integer, minimum: 0 }
        rounding_minor: { type: integer, minimum: 1, default: 1, description: Se redondea al múltiplo más cercano }
    Presence:
      type: string
      enum: [offline, free, busy]
    DocType:
      type: string
      description: 'Cédula, licencia, SOAT, revisión técnico-mecánica y tarjeta de propiedad (002)'
      enum: [national_id, license, mandatory_insurance, technical_inspection, vehicle_registration]
    ChosenDriver:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        vehicle_description: { type: string }
        presence: { $ref: '#/components/schemas/Presence' }
        busy_until_estimate: { type: [string, 'null'], format: date-time }
    DriverMe:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        qr_token: { type: string }
        presence: { $ref: '#/components/schemas/Presence' }
        subscription_status: { type: string, enum: [active, grace_period, suspended] }
        paid_until: { type: [string, 'null'], format: date-time }
        can_go_online: { type: boolean }
        block_reason: { type: [string, 'null'], enum: [subscription_suspended, kyc_expired, null] }
        blocked_documents:
          type: array
          description: 002. Documentos obligatorios que bloquean ONLINE; vacío si están al día
          items: { $ref: '#/components/schemas/DocumentProblem' }
        documents:
          type: array
          description: |
            Vista de 001: aprobados de license, mandatory_insurance y vehicle_registration con
            vencimiento. El detalle completo de 002 está en GET /v1/driver/onboarding.
          items:
            type: object
            properties:
              doc_type: { $ref: '#/components/schemas/DocType' }
              expires_at: { type: string, format: date }
              approved: { type: boolean }
    FareProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        proposed_by: { type: string, enum: [driver, passenger] }
        amount_minor: { type: integer }
        status: { type: string, enum: [open, accepted, rejected, superseded, expired] }
        expires_at: { type: string, format: date-time }
    TripStatus:
      type: string
      enum: [REQUESTED, FARE_PENDING, NEGOTIATION_PENDING, NEGOTIATING, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
    Trip:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TripStatus' }
        passenger_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
        distance_m: { type: integer }
        duration_s: { type: integer }
        currency: { type: string }
        suggested_fare_minor: { type: integer }
        agreed_fare_minor: { type: [integer, 'null'] }
        driver_payout_minor: { type: [integer, 'null'] }
        platform_commission_minor: { type: integer, const: 0 }
        open_proposal: { oneOf: [ { $ref: '#/components/schemas/FareProposal' }, { type: 'null' } ] }
        offer_expires_at:
          type: [string, 'null']
          format: date-time
          description: Plazo de la respuesta pendiente (oferta 25 s; confirmación, aceptar negociar o propuesta 30 s)
        negotiation_expires_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }

    # --- 002 ---------------------------------------------------------------------------------
    DocumentProblem:
      type: object
      description: 'Documento obligatorio que bloquea ONLINE (RN-KYQ-016): falta aprobado o vencido'
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        problem: { type: string, enum: [missing, expired] }
    Vehicle:
      type: object
      required: [plate, brand, model, color, year]
      properties:
        plate: { type: string, description: 'ABC123 o ABC12D (se normaliza a mayúsculas sin espacios)' }
        brand: { type: string, maxLength: 40 }
        model: { type: string, maxLength: 40 }
        color: { type: string, maxLength: 30 }
        year: { type: integer, description: '1990 a año actual + 1' }
    Document:
      type: object
      description: Envío de un documento. `number` solo lo ven el conductor y los administradores (FR-011).
      properties:
        id: { type: string, format: uuid }
        doc_type: { $ref: '#/components/schemas/DocType' }
        number: { type: string }
        expires_at: { type: [string, 'null'], format: date }
        exempt_until: { type: [string, 'null'], format: date }
        status: { type: string, enum: [uploading, submitted, approved, rejected, superseded] }
        expired: { type: boolean, description: 'Solo aprobados: ya no está vigente' }
        legacy: { type: boolean, description: 'Migrado de 001 o marcador sin fotos: hay que subir el real' }
        reject_reason: { type: [string, 'null'] }
        submitted_at: { type: [string, 'null'], format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        photos:
          type: array
          description: URLs firmadas de lectura (5 min) de las fotos subidas
          items:
            type: object
            properties:
              side: { type: string, enum: [front, back] }
              url: { type: string }
    DocumentSlot:
      type: object
      description: Un tipo obligatorio; `current` es el aprobado y `latest` el envío más reciente si no es el aprobado
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        label: { type: string }
        current: { oneOf: [ { $ref: '#/components/schemas/Document' }, { type: 'null' } ] }
        latest: { oneOf: [ { $ref: '#/components/schemas/Document' }, { type: 'null' } ] }
        rejected_count: { type: integer }
        suggest_support: { type: boolean, description: 'Tras 3 rechazos del mismo documento' }
    Onboarding:
      type: object
      properties:
        status: { type: string, enum: [profile_incomplete, documents_pending, in_review, documents_ok] }
        vehicle: { oneOf: [ { $ref: '#/components/schemas/Vehicle' }, { type: 'null' } ] }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
        blocked_documents: { type: array, items: { $ref: '#/components/schemas/DocumentProblem' } }
        subscription_status: { $ref: '#/components/schemas/BillingStatus' }
        paid_until: { type: [string, 'null'], format: date-time }
        can_go_online: { type: boolean }
    KycQueueEntry:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        vehicle_plate: { type: string }
        pending_documents: { type: integer }
        oldest_submitted_at: { type: string, format: date-time }
    KycDriverFile:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        phone_e164: { type: string }
        status: { type: string, enum: [profile_incomplete, documents_pending, in_review, documents_ok] }
        vehicle: { oneOf: [ { $ref: '#/components/schemas/Vehicle' }, { type: 'null' } ] }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSlot' } }
        blocked_documents: { type: array, items: { $ref: '#/components/schemas/DocumentProblem' } }
    BillingStatus:
      type: string
      description: 'Estado de la suscripción en 002; `unpaid` = nunca ha pagado'
      enum: [active, grace, suspended, unpaid]
    Price:
      type: object
      properties:
        amount_minor: { type: integer }
        currency: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid, description: También es la referencia en Bold }
        amount_minor: { type: integer }
        currency: { type: string }
        method: { type: string, enum: [bold, manual] }
        status: { type: string, enum: [created, processing, approved, rejected, expired, voided, needs_review] }
        checkout_url: { type: [string, 'null'], description: Solo mientras está en curso }
        payment_method_detail: { type: [string, 'null'], description: 'CREDIT_CARD, PSE, NEQUI…; en manuales, el medio' }
        covers_from: { type: [string, 'null'], format: date-time }
        covers_until: { type: [string, 'null'], format: date-time }
        void_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          properties:
            manual_reference: { type: [string, 'null'] }
            review_note: { type: [string, 'null'], description: 'Por qué quedó en needs_review' }
            created_by: { type: string, format: uuid }
            voided_by: { type: [string, 'null'], format: uuid }
    SubscriptionView:
      type: object
      properties:
        status: { $ref: '#/components/schemas/BillingStatus' }
        paid_until: { type: [string, 'null'], format: date-time }
        grace_until: { type: [string, 'null'], format: date-time }
        price: { oneOf: [ { $ref: '#/components/schemas/Price' }, { type: 'null' } ] }
        can_pay: { type: boolean, description: 'Documentos al día, precio definido y Bold activo' }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    SubscriptionRow:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        display_name: { type: string }
        phone_e164: { type: string }
        vehicle_plate: { type: string }
        status: { $ref: '#/components/schemas/BillingStatus' }
        paid_until: { type: [string, 'null'], format: date-time }
        grace_until: { type: [string, 'null'], format: date-time }
        last_payment:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, format: uuid }
                amount_minor: { type: integer }
                currency: { type: string }
                method: { type: string, enum: [bold, manual] }
                status: { type: string }
                created_at: { type: string, format: date-time }
    Notice:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: 'doc_expiring, doc_expired, doc_rejected, doc_approved, doc_legacy, sub_expiring, sub_grace, payment_approved, payment_rejected, payment_voided'
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    CostRate:
      type: object
      required: [concept, currency, unit_cost_micro, effective_from]
      properties:
        concept: { type: string, enum: [voice_minute, realtime_event, route_request, fixed_monthly] }
        currency: { type: string }
        unit_cost_micro: { type: integer, minimum: 0, description: Millonésimas de unidad mínima }
        effective_from: { type: string, format: date }
    CostBreakdown:
      type: object
      properties:
        month: { type: string }
        currency: { type: string }
        paid_minor: { type: integer, description: 'Pagos aprobados cuyo periodo empieza en el mes' }
        items:
          type: array
          items:
            type: object
            properties:
              concept: { type: string, enum: [voice_minute, realtime_event, route_request, fixed_monthly] }
              usage: { type: number, description: 'minutos, eventos o peticiones; 1 para el fijo' }
              cost_minor: { type: number }
        total_cost_minor: { type: number }
        margin_minor: { type: number }
    DriverCost:
      allOf:
        - $ref: '#/components/schemas/CostBreakdown'
        - type: object
          properties:
            driver_id: { type: string, format: uuid }
            display_name: { type: string }
            negative_margin: { type: boolean }

    # --- 004 ---------------------------------------------------------------------------------
    TripPaymentStatus:
      type: string
      enum: [pending, bold_in_progress, cash_reported, paid, unpaid, disputed, needs_review, voided]
    TripPayment:
      type: object
      properties:
        id: { type: string, format: uuid, description: También es la referencia en Bold }
        trip_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        passenger_id: { type: string, format: uuid }
        driver_name: { type: string }
        passenger_name: { type: string }
        amount_minor: { type: integer, description: Tarifa acordada }
        currency: { type: string }
        driver_amount_minor: { type: integer, description: 'Siempre igual a amount_minor (RN-KYQ-001)' }
        platform_commission_minor: { type: integer, const: 0 }
        status: { $ref: '#/components/schemas/TripPaymentStatus' }
        method: { type: [string, 'null'], description: '`bold` o `cash`: con qué se pagó o se intenta pagar' }
        accepted_methods:
          type: array
          description: 'Medios que el pasajero puede usar: los del conductor al completar (Bold solo si Kyq lo tiene activo)'
          items: { type: string, enum: [bold, cash] }
        checkout_url: { type: [string, 'null'], description: Solo en bold_in_progress }
        payment_method_detail: { type: [string, 'null'], description: 'CREDIT_CARD, PSE, NEQUI…' }
        cash_reported_at: { type: [string, 'null'], format: date-time }
        cash_confirmed_at: { type: [string, 'null'], format: date-time }
        disputed_at: { type: [string, 'null'], format: date-time }
        unpaid_marked_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        voided_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time, description: Momento en que se completó el viaje }
    AdminTripPayment:
      allOf:
        - $ref: '#/components/schemas/TripPayment'
        - type: object
          properties:
            review_note: { type: [string, 'null'], description: 'Valor distinto o segundo cobro de Bold' }
            resolution_note: { type: [string, 'null'] }
            resolved_by: { type: [string, 'null'], format: uuid }
            resolved_at: { type: [string, 'null'], format: date-time }
            void_reason: { type: [string, 'null'] }
            voided_by: { type: [string, 'null'], format: uuid }
    PaymentMethods:
      type: object
      properties:
        accepts_cash: { type: boolean }
        accepts_bold: { type: boolean }
        bold_available: { type: boolean, description: 'Bold está configurado en Kyq' }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [trip_credit, void_debit, payout] }
        amount_minor: { type: integer, description: 'Con signo: abono > 0; débito y giro < 0' }
        currency: { type: string }
        trip_payment_id: { type: [string, 'null'], format: uuid }
        trip_id: { type: [string, 'null'], format: uuid }
        payout_id: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'], description: Referencia del giro }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      properties:
        currency: { type: string }
        credited_minor: { type: integer, description: Abonos por pagos con Bold }
        debited_minor: { type: integer, description: Débitos por anulaciones (positivo) }
        paid_out_minor: { type: integer, description: Girado al conductor (positivo) }
        balance_minor: { type: integer, description: Por girar = abonado − debitado − girado }
    DriverSettlement:
      type: object
      properties:
        balances: { type: array, items: { $ref: '#/components/schemas/Balance' } }
        entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' }, description: 'Recientes primero (máx. 200)' }
        payments: { type: array, items: { $ref: '#/components/schemas/TripPayment' }, description: 'Pagos de viajes recientes (máx. 50)' }
    SettlementRow:
      allOf:
        - $ref: '#/components/schemas/Balance'
        - type: object
          properties:
            driver_id: { type: string, format: uuid }
            display_name: { type: string }
            phone_e164: { type: string }
            vehicle_plate: { type: string }
            last_payout_at: { type: [string, 'null'], format: date-time }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        currency: { type: string }
        reference: { type: string }
        note: { type: [string, 'null'] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
