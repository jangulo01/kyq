openapi: 3.1.0
info:
  title: Kyq API — 010 experiencia nativa (rutas nuevas y cambiadas)
  version: 0.6.0
  description: |
    Vista de las rutas nuevas y cambiadas de 010. Las definiciones viven en el contrato principal
    `specs/001-chosen-driver-trip-ptt/contracts/api.yaml`, contra el que corren las pruebas de
    contrato (`backend/internal/contracttest/native_test.go`); aquí solo se referencian.

    Cambios en rutas existentes:
    - `POST /v1/driver/location`: `accuracy_m` opcional; con un viaje aceptado, 10 s seguidos a
      < 60 m de la recogida con precisión ≤ 50 m lo pasan a `ARRIVED` (FR-010).
    - `GET /v1/affiliations`: `ChosenDriver.zone` (centro del hexágono de res. 8) solo si está
      libre con ubicación reciente.
    - `trip.offer` (realtime.md): `reservation` y `client_note` (solo al conductor).
